
<!DOCTYPE html>
<html>
  <body style="font-family: Roboto, Arial; padding:20px;">
    <div id="statusText">Loading data…</div>

    <div style="margin-top:8px; font-size:12px; color:#666;">
      Please keep this dialog open until the import is complete to avoid interruptions.
    </div>

    <div style="margin-top:15px; height:8px; background:#eee; border-radius:4px;">
      <div style="width:100%; height:100%; background:#4285f4; border-radius:4px; animation: pulse 1.5s infinite;"></div>
    </div>

    <style>
      @keyframes pulse {
        0% { opacity: .4; }
        50% { opacity: 1; }
        100% { opacity: .4; }
      }
    </style>

    <script>
      const FILE_ID = <?!= JSON.stringify(fileId) ?>;
      const MODE = <?!= JSON.stringify(mode) ?>;

      let nextIndex = 0;
      let copiedSheets = [];
      let isRunning = false;

      function updateStatus() {
        google.script.run
          .withSuccessHandler(function(name) {
            if (name) {
              document.getElementById("statusText").textContent =
                "Loading " + name + " data…";
            }
          })
          .getProgress();
      }

      function startPolling() {
        setInterval(updateStatus, 500);
      }

      function runBatch() {
        if (isRunning) return;
        isRunning = true;

        google.script.run
          .withSuccessHandler(function(result) {
            isRunning = false;
            copiedSheets = result.copiedSheets;

            if (result.done) {
              google.script.host.close();
              return;
            }

            nextIndex = result.nextIndex;
            runBatch();
          })
          .withFailureHandler(function(err) {
            alert("Error: " + err.message);
            google.script.host.close();
          })
          .importData(FILE_ID, MODE, nextIndex, copiedSheets);
      }

      window.onload = function() {
        startPolling();
        runBatch();
      };
    </script>
  </body>
</html>
